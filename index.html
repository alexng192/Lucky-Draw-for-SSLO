<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDO Lucky Draw</title>
    <link rel="stylesheet" href="style.css">
    </link>
    <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="sidebar" id="sidebar">
        <div>
            <h2><i class="fas fa-users me-2"></i>Input Names</h2>
            <textarea id="nameInput" placeholder="Enter each name on a new line..."></textarea>
            <button id="saveButton">
                <i class="fas fa-save me-2"></i>Save Names
            </button>
            <h2><i class="fas fa-hashtag me-2"></i>Draw Setting</h2>
            <div class="mb-3">
                <label for="numberInput" class="form-label">Number of winners to draw:</label>
                <input type="number" id="numberInput" class="form-control" placeholder="Enter number" min="1" max="100" value="1">
            </div>
        </div>
    </div>
    <div class="main">
        <div id="chart" class="hidden"></div>
        <div class="toggle-sidebar-btn" id="toggleSidebar">|||</div>
        <img src="SSLO Logo_Final.svg" style="height: 250px; position: relative; left: 40px;" alt="Italian Trulli">
        <h1>Lucky Draw</h1>
        <div class="door invisible" id="door">
            <div class="boxes" id="boxes" style="visibility: hidden;"></div>
        </div>
        <button id="drawButton" class="mt-4">
            <i class="fas fa-gift me-2"></i>Draw
        </button>
        <div class="winner" id="winner"> </div>
    </div>
    <!-- Bootstrap Modal -->
    <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🎉 Congratulations!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul id="pickedNamesList"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>
<script type="module" src="soundEffect.mjs"></script>
<script type="module" src="action.mjs"></script>
<script type="module" src="wheel.mjs"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</html>
